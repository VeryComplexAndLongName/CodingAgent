<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1c1c"/>
      <stop offset="100%" style="stop-color:#2a2a35"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0a500"/>
      <stop offset="100%" style="stop-color:#f5c542"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="627" fill="url(#bg3)"/>
  
  <!-- Gear/orchestration icon -->
  <g transform="translate(200,120)" filter="url(#glow3)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="#f0a500" stroke-width="3"/>
    <circle cx="50" cy="50" r="25" fill="none" stroke="#f5c542" stroke-width="2"/>
    <circle cx="50" cy="50" r="10" fill="#f0a500"/>
    <path d="M50,10 L50,25 M50,75 L50,90 M10,50 L25,50 M75,50 L90,50" stroke="#f0a500" stroke-width="3"/>
    <path d="M22,22 L32,32 M68,68 L78,78 M78,22 L68,32 M32,68 L22,78" stroke="#f5c542" stroke-width="2"/>
  </g>
  
  <!-- Money bag / dollar signs -->
  <g transform="translate(950,100)" opacity="0.9">
    <rect x="0" y="20" width="100" height="70" rx="10" fill="none" stroke="#f0a500" stroke-width="2.5"/>
    <path d="M20,20 Q50,0 80,20" fill="none" stroke="#f0a500" stroke-width="2.5"/>
    <text x="50" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#f0a500" text-anchor="middle">$</text>
    <!-- Small coins around -->
    <circle cx="-10" cy="40" r="8" fill="#f5c542" opacity="0.6"/>
    <circle cx="110" cy="50" r="8" fill="#f5c542" opacity="0.6"/>
    <circle cx="50" cy="100" r="8" fill="#f5c542" opacity="0.6"/>
  </g>
  
  <!-- Scales of justice - tipping left (cost) -->
  <g transform="translate(600,100)">
    <line x1="0" y1="10" x2="0" y2="90" stroke="#666666" stroke-width="3"/>
    <line x1="-80" y1="40" x2="80" y2="40" stroke="#f0a500" stroke-width="2"/>
    <!-- Left side (user quality) - higher -->
    <line x1="-80" y1="40" x2="-90" y2="70" stroke="#f0a500" stroke-width="1.5"/>
    <rect x="-100" y="65" width="40" height="30" rx="4" fill="#f0a500" opacity="0.3" stroke="#f0a500" stroke-width="1.5"/>
    <text x="-80" y="85" font-family="Arial, sans-serif" font-size="14" fill="#f0a500" text-anchor="middle">Качество</text>
    <!-- Right side (cost) - lower -->
    <line x1="80" y1="40" x2="90" y2="90" stroke="#f0a500" stroke-width="1.5"/>
    <rect x="75" y="85" width="40" height="30" rx="4" fill="#f0a500" opacity="0.6" stroke="#f0a500" stroke-width="1.5"/>
    <text x="95" y="105" font-family="Arial, sans-serif" font-size="14" fill="#f0a500" text-anchor="middle">Баботки</text>
  </g>
  
  <!-- Title -->
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="46" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow3)">
    Github Copilot
  </text>
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="32" fill="#f0a500" text-anchor="middle">
    Ордестратор, который играет на стороне пользователей
  </text>
  
  <!-- Warning text -->
  <rect x="350" y="400" width="500" height="50" rx="8" fill="#f0a500" opacity="0.1" stroke="#f0a500" stroke-width="1.5"/>
  <text x="600" y="430" font-family="Arial, sans-serif" font-size="20" fill="#f5c542" text-anchor="middle">
    Качество — за скобками 🚨
  </text>
  
  <!-- Bottom -->
  <rect x="450" y="500" width="300" height="3" fill="url(#accent3)" rx="1"/>
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="18" fill="#666666" text-anchor="middle">
    OpenSpec Series • Article 3
  </text>
  
  <path d="M0,627 L60,627 L60,580 L0,580 Z" fill="#f0a500" opacity="0.8"/>
  <path d="M1140,627 L1200,627 L1200,580 L1140,580 Z" fill="#f0a500" opacity="0.8"/>
</svg>

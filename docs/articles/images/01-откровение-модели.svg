<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="627" fill="url(#bg1)"/>
  
  <!-- Abstract network nodes -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1" fill="none">
    <line x1="100" y1="80" x2="300" y2="150"/>
    <line x1="300" y1="150" x2="500" y2="100"/>
    <line x1="500" y1="100" x2="700" y2="180"/>
    <line x1="700" y1="180" x2="900" y2="120"/>
    <line x1="900" y1="120" x2="1100" y2="200"/>
    <line x1="100" y1="80" x2="200" y2="250"/>
    <line x1="200" y1="250" x2="400" y2="300"/>
    <line x1="400" y1="300" x2="600" y2="250"/>
    <line x1="600" y1="250" x2="800" y2="300"/>
    <line x1="800" y1="300" x2="1000" y2="250"/>
  </g>
  
  <!-- Node circles -->
  <g filter="url(#glow)">
    <circle cx="100" cy="80" r="6" fill="#e94560"/>
    <circle cx="300" cy="150" r="8" fill="#e94560"/>
    <circle cx="500" cy="100" r="5" fill="#ff6b6b"/>
    <circle cx="700" cy="180" r="7" fill="#e94560"/>
    <circle cx="900" cy="120" r="6" fill="#ff6b6b"/>
    <circle cx="1100" cy="200" r="5" fill="#e94560"/>
    <circle cx="200" cy="250" r="5" fill="#ff6b6b"/>
    <circle cx="400" cy="300" r="7" fill="#e94560"/>
    <circle cx="600" cy="250" r="8" fill="#ff6b6b"/>
    <circle cx="800" cy="300" r="6" fill="#e94560"/>
    <circle cx="1000" cy="250" r="5" fill="#ff6b6b"/>
  </g>
  
  <!-- Central brain/eye icon -->
  <g transform="translate(600,100)">
    <ellipse cx="0" cy="0" rx="45" ry="30" fill="none" stroke="url(#accent1)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="15" fill="url(#accent1)"/>
    <circle cx="0" cy="0" r="7" fill="#1a1a2e"/>
    <path d="M-25,0 Q0,-20 25,0" fill="none" stroke="#e94560" stroke-width="2"/>
    <path d="M-25,0 Q0,20 25,0" fill="none" stroke="#e94560" stroke-width="2"/>
  </g>
  
  <!-- Title text -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">
    Откровение модели
  </text>
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="30" fill="#cccccc" text-anchor="middle">
    Честный разговор о том, где я сижу
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="430" font-family="Arial, sans-serif" font-size="24" fill="#e94560" text-anchor="middle">
    OpenAI vs Anthropic vs Меня
  </text>
  
  <!-- Bottom line -->
  <rect x="450" y="460" width="300" height="3" fill="url(#accent1)" rx="1"/>
  
  <!-- Bottom tag -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="18" fill="#666666" text-anchor="middle">
    OpenSpec Series • Article 1
  </text>
  
  <!-- Corner accent -->
  <path d="M0,627 L60,627 L60,580 L0,580 Z" fill="#e94560" opacity="0.8"/>
  <path d="M1140,627 L1200,627 L1200,580 L1140,580 Z" fill="#e94560" opacity="0.8"/>
</svg>

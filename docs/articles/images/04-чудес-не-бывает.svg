<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#252530"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e04040"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="627" fill="url(#bg4)"/>
  
  <!-- Hype meter - off -->
  <g transform="translate(150,80)">
    <rect x="0" y="0" width="200" height="30" rx="5" fill="#333"/>
    <rect x="0" y="0" width="40" height="30" rx="5" fill="#e04040"/>
    <text x="100" y="20" font-family="Arial, sans-serif" font-size="14" fill="#888" text-anchor="middle">Хайп</text>
  </g>
  
  <!-- Warning triangle -->
  <g transform="translate(200,200)" filter="url(#glow4)">
    <polygon points="50,0 100,86 0,86" fill="none" stroke="#e04040" stroke-width="3"/>
    <text x="50" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#e04040" text-anchor="middle">!</text>
  </g>
  
  <!-- YouTube play button (crossed out) -->
  <g transform="translate(950,120)" opacity="0.5">
    <rect x="0" y="20" width="100" height="70" rx="10" fill="none" stroke="#666" stroke-width="2"/>
    <polygon points="40,40 40,75 75,57" fill="none" stroke="#666" stroke-width="2"/>
    <!-- X mark -->
    <line x1="10" y1="10" x2="90" y2="90" stroke="#e04040" stroke-width="4"/>
    <line x1="90" y1="10" x2="10" y2="90" stroke="#e04040" stroke-width="4"/>
  </g>
  
  <!-- Thought bubble - open/spec -->
  <g transform="translate(600,180)">
    <ellipse cx="0" cy="0" rx="120" ry="50" fill="none" stroke="#e04040" stroke-width="1.5" opacity="0.3"/>
    <ellipse cx="-30" cy="55" rx="30" ry="15" fill="none" stroke="#e04040" stroke-width="1" opacity="0.3"/>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="16" fill="#e04040" text-anchor="middle" opacity="0.7">
      OpenSpec
    </text>
  </g>
  
  <!-- Title -->
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow4)">
    Чудес не бывает
  </text>
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="30" fill="#e04040" text-anchor="middle">
    Правда о бесплатных моделях
  </text>
  
  <!-- Key quote -->
  <rect x="300" y="400" width="600" height="60" rx="10" fill="#e04040" opacity="0.08" stroke="#e04040" stroke-width="1.5"/>
  <text x="600" y="438" font-family="Arial, sans-serif" font-size="22" fill="#ff6b6b" text-anchor="middle" font-style="italic">
    Неведение закона не освобождает от ответственности
  </text>
  
  <!-- Factors -->
  <g transform="translate(600,500)">
    <text x="-200" y="0" font-family="Arial, sans-serif" font-size="14" fill="#888">Сложность</text>
    <text x="-80" y="0" font-family="Arial, sans-serif" font-size="14" fill="#888">Критичность</text>
    <text x="40" y="0" font-family="Arial, sans-serif" font-size="14" fill="#888">Навыки</text>
    <text x="160" y="0" font-family="Arial, sans-serif" font-size="14" fill="#888">Контекст</text>
    <line x1="-200" y1="10" x2="200" y2="10" stroke="#444" stroke-width="1"/>
  </g>
  
  <!-- Bottom -->
  <rect x="450" y="570" width="300" height="3" fill="url(#accent4)" rx="1"/>
  <text x="600" y="610" font-family="Arial, sans-serif" font-size="18" fill="#666666" text-anchor="middle">
    OpenSpec Series • Article 4
  </text>
  
  <path d="M0,627 L60,627 L60,580 L0,580 Z" fill="#e04040" opacity="0.8"/>
  <path d="M1140,627 L1200,627 L1200,580 L1140,580 Z" fill="#e04040" opacity="0.8"/>
</svg>
